name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: src/go.mod

      - name: Run tests
        working-directory: src
        run: go test -v ./...

      - name: Run linting
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: src
          args: --timeout=5m